<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Debugger</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 150px; padding: 0.5rem; font-family: monospace; font-size: 1rem; }
    button { padding: 0.75rem 1.5rem; font-size: 1rem; margin-top: 0.5rem; }
    #response { margin-top: 1rem; padding: 1rem; background:#f0f8ff; border-left: 4px solid #4a90e2; }
    .bug-list { margin-top: 2rem; }
    .bug-item { background:#fff; margin-bottom:0.5rem; padding:0.5rem; border:1px solid #ddd; }
  </style>
</head>
<body>
  <h1>ML Debugger</h1>
  <textarea id="errorInput" placeholder="Paste your error message here..."></textarea>
  <button id="analyzeBtn">Analyze</button>
  <div id="response"></div>

  <div class="bug-list" id="bugList"></div>

  <script>
    const analyzeBtn = document.getElementById("analyzeBtn");
    const errorInput = document.getElementById("errorInput");
    const responseDiv = document.getElementById("response");
    const bugList = document.getElementById("bugList");

    errorInput.addEventListener("paste", async (e) => {
      const text = e.clipboardData.getData("text");
      if (text.trim()) {
        errorInput.value = text;
        await analyzeError();
      }
    });

    async function analyzeError() {
      const message = errorInput.value.trim();
      if (!message) return;
      const resp = await fetch("http://localhost:8000/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ error_message: message })
      });
      const data = await resp.json();
      responseDiv.innerHTML = "<strong>Suggestion:</strong> " + data.suggestion;
      loadBugs();
    }

    async function loadBugs() {
      const resp = await fetch("http://localhost:8000/bugs");
      const bugs = await resp.json();
      bugList.innerHTML = "";
      bugs.forEach(b => {
        const div = document.createElement("div");
        div.className = "bug-item";
        div.innerHTML = `<strong>#${b.id}</strong> ${b.error_message.substring(0,60)}${b.error_message.length>60?"...":""}<br><small>${b.created_at}</small><p>${b.solution}</p>`;
        bugList.appendChild(div);
      });
    }

    analyzeBtn.addEventListener("click", analyzeError);
    loadBugs();
  </script>
</body>
</html>
